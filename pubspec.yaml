name: portfolio
description: "Personal portfolio of Barend Blom."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/pdf/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    # Katakana subset for the matrix rain. Neither Inter nor SpaceGrotesk has
    # katakana, and relying on the browser to fetch Noto at runtime leaves the
    # rain as tofu boxes on the first frames.
    - family: MatrixGlyphs
      fonts:
        - asset: assets/fonts/MatrixGlyphs.ttf
