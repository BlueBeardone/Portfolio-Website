services:
  - type: web
    name: barend-portfolio
    runtime: static
    buildCommand: bash scripts/render-build.sh
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_VERSION
        value: 3.47.0
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
